<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"><link rel="icon" href="{{ url_for('static', filename='i192.png') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='i192.png') }}"><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3"><title>ٹیکسی حساب</title></head><body>
<header><div class="brand"><span class="mark ic"><svg viewBox="0 0 24 24"><path d="M5 16l1.6-5a2 2 0 0 1 1.9-1.4h7a2 2 0 0 1 1.9 1.4L19 16M4 16h16v3h-2v-1.5H6V19H4zM7.5 13h9"/></svg></span>ٹیکسی حساب</div>{% if u %}<div class="who"><span>{{u.name}}</span><a href="/logout">باہر</a></div>{% endif %}</header>
<main>{% for m in get_flashed_messages() %}<p class="msg">{{m}}</p>{% endfor %}{% block c %}{% endblock %}</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function (e) {
      console.warn("SW registration failed:", e);
    });
  });
}
</script>{% block s %}{% endblock %}</body></html>
